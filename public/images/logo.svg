<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160">
  <defs>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DC9A5"/>
      <stop offset="100%" style="stop-color:#1A8A6E"/>
    </linearGradient>
  </defs>

  <!-- Main wordmark - custom letter forms -->
  <g transform="translate(30, 30)">
    <!-- V -->
    <path d="M 0 10 L 22 80 L 44 10" stroke="#2D3436" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- I - stem only, no dot -->
    <line x1="68" y1="10" x2="68" y2="80" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>

    <!-- Living dot on the I - leaf/droplet shape -->
    <path d="M 68 -8 Q 75 -14 78 -6 Q 80 0 68 4 Q 56 0 58 -6 Q 61 -14 68 -8 Z" fill="url(#dotGrad)"/>
    <!-- Tiny vein in the leaf-dot -->
    <line x1="68" y1="-8" x2="68" y2="2" stroke="#1A6B5A" stroke-width="0.8" opacity="0.5"/>

    <!-- T -->
    <line x1="92" y1="10" x2="132" y2="10" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>
    <line x1="112" y1="10" x2="112" y2="80" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>

    <!-- A -->
    <path d="M 150 80 L 172 10 L 194 80" stroke="#2D3436" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="158" y1="55" x2="186" y2="55" stroke="#2D3436" stroke-width="5" stroke-linecap="round"/>

    <!-- E -->
    <line x1="218" y1="10" x2="218" y2="80" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>
    <line x1="218" y1="10" x2="250" y2="10" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>
    <line x1="218" y1="45" x2="244" y2="45" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>
    <line x1="218" y1="80" x2="250" y2="80" stroke="#2D3436" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Tagline -->
  <text x="32" y="135" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="14" letter-spacing="12" fill="#999">TECHNOLOGIES</text>
</svg>